name: Deploy tamlelan-processor

# Tests run on every push and pull request. Deployment stays MANUAL by design --
# deploys have always been a deliberate action here. The workflow makes that
# deliberate action safe, not automatic.
on:
  workflow_dispatch:
  push:
  pull_request:

env:
  PROJECT_ID: gen-lang-client-0839027862
  REGION: us-west1
  SERVICE: tamlelan-processor
  REQUIRED_ENV_VARS: "DRIVE_FOLDER_ID APPS_SCRIPT_URL GEMINI_API_KEY WEBHOOK_SECRET"
  # Cloud Run sizing is pinned here rather than inherited, so it is reviewable in
  # git. 540s did not fit the workload: the happy path measured ~430s and a single
  # retry of the transcript pass reached ~588s, past the limit -- and a hard kill
  # skips the finally block entirely, leaving no failed/ copy and no alert.
  RUN_TIMEOUT: "3600"
  RUN_MEMORY: "2Gi"

# Two dispatches racing would let --to-revisions target a revision the other job
# deployed. Serialise them.
concurrency:
  group: deploy-tamlelan
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  # ====================================================================
  # The gate. Before this existed the pipeline deployed without ever
  # running the test suite -- it would happily ship a revision whose
  # tests were 100% red, and the Phase 1 retry/timeout code reached
  # production having been exercised by neither a test nor a smoke check.
  # ====================================================================
  test-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches the Cloud Run runtime

      # Deliberately ONLY cloud/requirements.txt. Installing anything extra here
      # would let a missing dependency pass CI and crash on Cloud Run.
      - name: Install cloud dependencies
        run: pip install -r cloud/requirements.txt

      - name: Cloud pipeline suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_main_*.py" -v 2>&1 | tee /tmp/main.log
          COUNT=$(grep -oP '^Ran \K[0-9]+' /tmp/main.log)
          echo "cloud pipeline tests: $COUNT"
          if [ "$COUNT" -lt 62 ]; then
            echo "::error::Ran $COUNT cloud tests, expected >= 62. Tests were deleted or failed to load."
            exit 1
          fi

      - name: Metrics suite
        run: python -m unittest discover -s tests -p "test_metrics_*.py" -v

      - name: Transcript-quality suite
        run: python -m unittest discover -s tests -p "test_transcript_*.py" -v

      - name: Chunking suite
        run: python -m unittest discover -s tests -p "test_chunking.py" -v

      # A fake diverging from the real API does not fail a suite -- it silently
      # deletes coverage. This happened for months: six of the nine FakeBlob
      # copies lacked the content_type kwarg, so ~40 of 49 runs never executed
      # the metrics path while printing a warning nobody read.
      - name: Fail on swallowed-exception warnings
        run: |
          set -euo pipefail
          if grep -qE "unexpected keyword argument|Could not write metrics record" /tmp/main.log; then
            echo "::error::A test fake has diverged from the real API -- a code path is silently untested."
            exit 1
          fi

      # Config lines whose removal is silent but expensive. Each is tied to a
      # measured production failure, so a plain grep is worth its keep.
      - name: Load-bearing configuration assertions
        run: |
          set -euo pipefail
          grep -q 'thinking_level="LOW"' cloud/main.py \
            || { echo "::error::thinking_level=LOW removed -- reintroduces the confirmed MAX_TOKENS truncation."; exit 1; }
          grep -q 'include_turns=False' cloud/main.py \
            || { echo "::error::Pass 2 lost include_turns=False -- reintroduces the diarization template echo (measured 1.00)."; exit 1; }
          grep -q 'HttpOptions(timeout=' cloud/main.py \
            || { echo "::error::Explicit Gemini HTTP timeout removed -- reintroduces the reproduced indefinite hang."; exit 1; }

  test-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Separate job, not a later step: the client and cloud environments are
      # genuinely isolated (the client suite needs numpy/scipy, which must never
      # be present when the cloud suite runs).
      - name: Install client dependencies
        run: pip install -r requirements-client.txt
      - name: Client suite
        run: python -m unittest discover -s tests -p "test_scribe_*.py" -v

  deploy:
    needs: [test-cloud, test-client]     # <-- structural gate, not a reorderable step
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # ------------------------------------------------------------------
      # Step 1: deploy with --no-traffic and a unique tag, exactly matching
      # README section 6's mandatory sequence -- that sequence encoded as a
      # script instead of a checklist a human has to remember.
      # ------------------------------------------------------------------
      - name: Deploy new revision (no traffic yet)
        id: deploy
        run: |
          set -euo pipefail
          TAG="rev-${{ github.run_id }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          gcloud run deploy "$SERVICE" \
            --source=./cloud \
            --function=tamlelan_handler \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --timeout="$RUN_TIMEOUT" \
            --memory="$RUN_MEMORY" \
            --no-traffic \
            --tag="$TAG" \
            --quiet

          REVISION=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT_ID" \
            --format=json | jq -r --arg TAG "$TAG" '.status.traffic[] | select(.tag==$TAG) | .revisionName')
          if [ -z "$REVISION" ] || [ "$REVISION" = "null" ]; then
            echo "::error::Could not resolve the newly deployed revision name."
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Deployed revision: $REVISION"

      # ------------------------------------------------------------------
      # Step 2: verify the --function flag actually took effect. This is the
      # exact class of bug that broke four consecutive deployments silently
      # in the past (Ready: True, crashing on every real request).
      #
      # Confirmed live 2026-09-02: current gcloud returns this annotation as a
      # JSON map keyed by container name, not the bare string README section 6
      # assumes. Parsed with jq so the check can't silently want a format that
      # no longer exists.
      # ------------------------------------------------------------------
      - name: Verify build-function-target annotation
        run: |
          set -euo pipefail
          TARGET=$(gcloud run revisions describe "${{ steps.deploy.outputs.revision }}" \
            --region="$REGION" --project="$PROJECT_ID" \
            --format="value(metadata.annotations['run.googleapis.com/build-function-target'])")
          echo "build-function-target: '$TARGET'"
          if ! echo "$TARGET" | jq -e '[.[]] | length > 0 and all(. == "tamlelan_handler")' >/dev/null 2>&1; then
            echo "::error::build-function-target is '$TARGET', expected every container's target to be 'tamlelan_handler'. Traffic will NOT be migrated."
            exit 1
          fi

      # ------------------------------------------------------------------
      # Step 3: all four env vars present AND non-empty. Name-only checking
      # would pass a revision with GEMINI_API_KEY="".
      # ------------------------------------------------------------------
      - name: Verify required env vars present and non-empty
        run: |
          set -euo pipefail
          ENV_JSON=$(gcloud run revisions describe "${{ steps.deploy.outputs.revision }}" \
            --region="$REGION" --project="$PROJECT_ID" --format=json \
            | jq -c '[.spec.containers[].env[]?]')
          for VAR in $REQUIRED_ENV_VARS; do
            if ! echo "$ENV_JSON" | jq -e --arg V "$VAR" \
                 '[.[] | select(.name==$V)] | length > 0 and (((.[0].value // "") != "") or (.[0] | has("valueFrom")))' >/dev/null; then
              echo "::error::Required env var '$VAR' is missing or empty on the new revision. Traffic will NOT be migrated."
              exit 1
            fi
          done
          echo "All required env vars present and populated."

      # ------------------------------------------------------------------
      # The former step 4 (synthetic CloudEvent smoke test) has been REMOVED.
      #
      # Root cause of its long-running 404, found 2026-09-03: the service has
      # ingress=internal. Ingress is evaluated BEFORE IAM, which is why the call
      # failed identically with and without an auth token, and why it failed
      # against the known-good production URL too. A GitHub runner is public
      # internet, so it was rejected at the network edge every time -- no payload
      # shape could ever have worked.
      #
      # Keeping ingress=internal is the right security posture, so the test is
      # dropped rather than the setting weakened. Its value is replaced by the
      # test-cloud gate above, which exercises far more than the six-line
      # early-exit filter the smoke test reached. A --no-traffic tagged revision
      # can never be exercised by real Eventarc anyway, so any pre-migration
      # smoke test was always a synthetic simulation.
      # ------------------------------------------------------------------

      # ------------------------------------------------------------------
      # Step 4: migrate traffic to the revision that was actually verified.
      # --to-latest routes to the newest revision by creation time, which is
      # not necessarily the one steps 2-3 checked.
      # ------------------------------------------------------------------
      - name: Migrate traffic to the verified revision
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" \
            --to-revisions="${{ steps.deploy.outputs.revision }}=100" \
            --region="$REGION" --project="$PROJECT_ID"

      # ------------------------------------------------------------------
      # Step 5: confirm the migration actually landed. Previously the workflow
      # ended on the update-traffic call, so a partial migration reported success.
      # ------------------------------------------------------------------
      - name: Verify traffic landed on the verified revision
        run: |
          set -euo pipefail
          SERVING=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT_ID" --format=json \
            | jq -r '.status.traffic[] | select(.percent==100) | .revisionName' | head -1)
          echo "Serving: $SERVING"
          if [ "$SERVING" != "${{ steps.deploy.outputs.revision }}" ]; then
            echo "::error::Expected ${{ steps.deploy.outputs.revision }} to serve 100% of traffic, but '$SERVING' does."
            exit 1
          fi
          gcloud run services update-traffic "$SERVICE" \
            --remove-tags="${{ steps.deploy.outputs.tag }}" \
            --region="$REGION" --project="$PROJECT_ID" --quiet || true
          echo "Deployed and serving: ${{ steps.deploy.outputs.revision }}"
